name: Playwright E2E Tests & Allure Report

on:
  schedule:
    - cron: '0 6 * * 1-5' # Pokreće se svakog radnog dana u 06:00 UTC
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Specifični fajl za testiranje (ostavi prazno za sve testove)'
        required: false
        default: ''
      test_title:
        description: 'Filter naslova testa (-g flag)'
        required: false
        default: ''
      send_email:
        description: 'Pošalji email notifikaciju po završetku'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests & Deploy Allure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          CI: 'true'
          TEST_ENV: 'staging'
          STAGING_ADMIN_PROFESSIONAL_PASSWORD: ${{ secrets.STAGING_ADMIN_PROFESSIONAL_PASSWORD }}
          STAGING_SUPERADMIN_PASSWORD: ${{ secrets.STAGING_SUPERADMIN_PASSWORD }}
        run: |
          FLAGS="--project=Chromium --reporter=line,allure-playwright"
          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            FLAGS="${{ github.event.inputs.test_file }} $FLAGS"
          fi
          if [ -n "${{ github.event.inputs.test_title }}" ]; then
            FLAGS="$FLAGS -g \"${{ github.event.inputs.test_title }}\""
          fi
          npx playwright test $FLAGS || true

      - name: Extract Allure Summary
        if: always()
        run: node scripts/extract-allure-summary.js || true

      - name: Generate & Deploy Allure Report to GitHub Pages (Keep Last 5 Builds)
        if: always()
        run: node scripts/deploy-allure-gh-pages.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-build-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Read Test Summary Metrics
        if: always()
        id: summary
        run: |
          TOTAL=$(cat total-tests.txt 2>/dev/null || echo "0")
          PASSED=$(cat passed-tests.txt 2>/dev/null || echo "0")
          FAILED=$(cat failed-tests-count.txt 2>/dev/null || echo "0")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          if [ "$FAILED" -gt "0" ]; then
            echo "status_text=FAILURE" >> $GITHUB_OUTPUT
            echo "status_color=#e53e3e" >> $GITHUB_OUTPUT
          else
            echo "status_text=SUCCESS" >> $GITHUB_OUTPUT
            echo "status_color=#2eae6f" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML Email Report
        if: always()
        run: node scripts/generate-email-html.js
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TEST_ENV: 'staging'
          REPORT_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/builds/${{ github.run_number }}/"
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send Email Notification
        if: always() && (github.event.inputs.send_email == 'true' || github.event_name != 'workflow_dispatch')
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: councilboxautotest@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Councilbox QA Report - Build #${{ github.run_number }} - ${{ steps.summary.outputs.status_text }}"
          to: ammar.micijevic@councilbox.com, dzenan.dzakmic@councilbox.com, muhamed.adzamija@councilbox.com, almir.demirovic@councilbox.com, emiliano.ribaudo@councilbox.com
          from: Councilbox Automation <councilboxautotest@gmail.com>
          html_body: file://email-body.html

      - name: Send MS Teams Adaptive Card Notification
        if: always()
        continue-on-error: true
        run: node scripts/send-teams-card.js
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
          REPORT_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/builds/${{ github.run_number }}/"
          GITHUB_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
