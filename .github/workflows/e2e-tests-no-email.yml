name: Playwright E2E Tests (Bez Emaila)

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Specifični fajl za testiranje (ostavi prazno za sve testove)'
        required: false
        default: ''
      test_title:
        description: 'Filter naslova testa (-g flag)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests & Deploy Allure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          CI: 'true'
          TEST_ENV: 'staging'
          STAGING_ADMIN_PROFESSIONAL_PASSWORD: ${{ secrets.STAGING_ADMIN_PROFESSIONAL_PASSWORD }}
          STAGING_SUPERADMIN_PASSWORD: ${{ secrets.STAGING_SUPERADMIN_PASSWORD }}
        run: |
          FLAGS="--project=Chromium --reporter=line,allure-playwright"
          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            FLAGS="${{ github.event.inputs.test_file }} $FLAGS"
          fi
          if [ -n "${{ github.event.inputs.test_title }}" ]; then
            FLAGS="$FLAGS -g \"${{ github.event.inputs.test_title }}\""
          fi
          npx playwright test $FLAGS || true

      - name: Extract Allure Summary
        if: always()
        run: node scripts/extract-allure-summary.js || true

      - name: Generate Allure Metadata & Report
        if: always()
        run: |
          node generate-allure-meta.js || true
          npx allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: builds/${{ github.run_number }}
          keep_files: true

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-build-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Read Test Summary Metrics
        if: always()
        id: summary
        run: |
          TOTAL=$(cat total-tests.txt 2>/dev/null || echo "0")
          PASSED=$(cat passed-tests.txt 2>/dev/null || echo "0")
          FAILED=$(cat failed-tests-count.txt 2>/dev/null || echo "0")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          if [ "$FAILED" -gt "0" ]; then
            echo "status_text=FAILURE" >> $GITHUB_OUTPUT
          else
            echo "status_text=SUCCESS" >> $GITHUB_OUTPUT
          fi

      - name: Send MS Teams Notification
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then
            REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/builds/${{ github.run_number }}/"
            STATUS="${{ steps.summary.outputs.status_text }}"
            TOTAL="${{ steps.summary.outputs.total }}"
            PASSED="${{ steps.summary.outputs.passed }}"
            FAILED="${{ steps.summary.outputs.failed }}"
            
            if [ "$STATUS" = "SUCCESS" ]; then ICON="✅"; else ICON="❌"; fi

            TEXT="📢 *Councilbox QA Report - Build #${{ github.run_number }}* ($ICON $STATUS)\n\n📊 *Summary:*\n• Total: $TOTAL\n• Passed: $PASSED\n• Failed: $FAILED\n\n🔗 [View Allure Report]($REPORT_URL)"

            curl -s -X POST "$TEAMS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"$TEXT\"}" || true
          fi
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
